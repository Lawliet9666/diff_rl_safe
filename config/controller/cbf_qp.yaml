type: cbf_qp
qp_obs_top_k: null  # null: all; positive integer: nearest obstacles by robot-center distance.

solver:
  eps_abs: 1.0e-9
  eps_rel: 1.0e-9
  max_iter: 10000
  feasibility_tolerance: 1.0e-6
  polishing: false
  verbose: false

unicycle:
  lookahead: 0.2
  alpha: 2.0
  weights: [1.0, 1.0]  # World velocity x/y of the lookahead point.
  position_gain: 1.0

quadrotor:
  gains: [1.5, 1.5, 1.5]
  thrust_gain: 4.0
  tilt_gain: 4.0
  weights: [1.0, 1.0, 1.0, 1.0e-6]  # World jerk x/y/z, then yaw-rate tie-breaker.
  position_gain: 1.0
  velocity_gain: 1.8
  attitude_gain: 4.0
  thrust_tracking_gain: 4.0
  acceleration_limits: [2.0, 2.0, 2.0]

# Same three physical inputs and QP objective for either humanoid barrier.
humanoid:
  barrier: distance  # distance (second order) or parabolic (first order).
  gains: [1.5, 1.5]
  alpha: 2.0
  parabolic_gain: 1.0
  clearance_gain: 1.0
  speed_epsilon: 0.05  # Smooth speed regularization used in content.tex.
  weights: [1.0, 1.0, 1.0]  # Forward/lateral acceleration, then yaw rate.
  position_gain: 1.0
  velocity_gain: 2.0
  heading_gain: 2.0

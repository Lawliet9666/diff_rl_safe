type: cbf_qp
slack_weight: 0.0  # 0: hard CBF-QP; >0: obstacle slack penalty (unicycle only).
qp_obs_top_k: null  # null: all; positive integer: nearest obstacles by robot-center distance.

solver:
  eps_abs: 1.0e-9
  eps_rel: 1.0e-9
  max_iter: 10000
  feasibility_tolerance: 1.0e-6
  polishing: false
  verbose: false

# Linear class-K functions: alpha_i(s) = kappa_i*s; rates are positive [1/s].
unicycle:
  lookahead: 0.2  # Shared tracking point for nominal control, CBF and QP.
  nominal:
    position_gain: 1.0
  cbf:
    kappa: [2.0]  # [kappa_1]: h_dot + kappa_1*h >= 0.
  qp:
    weights: [1.0, 1.0]  # World velocity x/y of the lookahead point.

quadrotor:
  nominal:
    position_gain: 1.0
    velocity_gain: 1.8
    attitude_gain: 4.0
    thrust_tracking_gain: 4.0
    acceleration_limits: [2.0, 2.0, 2.0]  # Desired acceleration clipping only.
  cbf:
    kappa: [1.5, 1.5, 1.5]  # [kappa_1, kappa_2, kappa_3]: obstacle/altitude HOCBFs.
    kappa_thrust: 4.0  # First-order thrust CBF rate [1/s].
    kappa_tilt: 4.0  # First-order tilt CBF rate [1/s].
  qp:
    weights: [1.0, 1.0, 1.0, 1.0e-6]  # World jerk x/y/z, then yaw-rate tie-breaker.

humanoid:
  barrier: distance  # distance (second order) or parabolic (first order).
  nominal:
    position_gain: 1.0
    velocity_gain: 2.0
    heading_gain: 2.0
  cbf:
    distance:
      kappa: [1.5, 1.5]  # [kappa_1, kappa_2]: recursive distance HOCBF.
    parabolic:
      kappa: [2.0]  # [kappa_1]: h_dot + kappa_1*h >= 0.
      parabolic_gain: 1.0  # Barrier curvature; not a class-K rate.
      clearance_gain: 1.0  # Barrier clearance term; not a class-K rate.
      speed_epsilon: 0.05  # Smooth speed regularization used in content.tex.
  qp:
    weights: [1.0, 1.0, 1.0]  # Forward/lateral acceleration, then yaw rate.

double_integrator:
  nominal:
    position_gain: 1.0
    velocity_gain: 2.0
  cbf:
    kappa: [1.5, 1.5]  # [kappa_1, kappa_2]: recursive distance HOCBF.
  qp:
    weights: [1.0, 1.0]  # World acceleration x/y.

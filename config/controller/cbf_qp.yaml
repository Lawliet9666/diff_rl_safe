type: cbf_qp
slack_weight: 10.0  # 0: hard; >0: obstacle slack for every robot; physical limits stay hard.
qp_obs_top_k: 5  # null: all; k>0: nearest k obstacles.

solver:
  eps_abs: 1.0e-9
  eps_rel: 1.0e-9
  max_iter: 10000
  adaptive_rho_interval: 25  # Fixed rho-update interval.
  feasibility_tolerance: 1.0e-6
  polishing: false
  verbose: false

# Class-K rates: alpha_i(s) = kappa_i*s [1/s].
single_integrator:
  nominal:
    position_gain: 1.0
  cbf:
    kappa: [2.0]  # h_dot + kappa_1*h >= 0
  qp:
    weights: [1.0, 1.0]  # World velocity x/y.

unicycle:
  lookahead: 0.2  # m; tracking-point offset
  nominal:
    position_gain: 1.0
  cbf:
    kappa: [2.0]  # h_dot + kappa_1*h >= 0
  qp:
    weights: [1.0, 1.0]  # Lookahead world velocity x/y.

quadrotor:
  nominal:
    position_gain: 1.0
    velocity_gain: 2.0
    attitude_gain: 4.0
    thrust_tracking_gain: 4.0
  cbf:
    kappa: [1.5, 1.5, 1.5]  # Obstacle/altitude HOCBF rates.
    kappa_speed: [4.0, 4.0]  # Total-speed HOCBF rates.
    kappa_thrust: 4.0  # Thrust CBF rate.
    kappa_tilt: 4.0  # Tilt CBF rate.
  qp:
    weights: [1.0, 1.0, 1.0, 1.0e-6]  # World jerk x/y/z, then omega_z.

humanoid:
  barrier: distance  # distance: order 2; parabolic: order 1.
  nominal:
    position_gain: 1.0
    velocity_gain: 2.0
    heading_gain: 2.0
  cbf:
    kappa_speed: 4.0  # Shared first-order total-speed CBF rate.
    distance:
      kappa: [1.5, 1.5]  # Distance HOCBF rates.
    parabolic:
      kappa: [2.0]  # h_dot + kappa_1*h >= 0
      parabolic_gain: 1.0  # Curvature.
      clearance_gain: 1.0  # Clearance term.
      speed_epsilon: 0.05  # Speed smoothing.
  qp:
    weights: [1.0, 1.0, 1.0]  # a_f, a_l, omega.

double_integrator:
  nominal:
    position_gain: 1.0
    velocity_gain: 2.0
  cbf:
    kappa: [1.5, 1.5]  # Distance HOCBF rates.
    kappa_speed: 4.0  # h_v_dot + kappa_speed*h_v >= 0 [1/s].
  qp:
    weights: [1.0, 1.0]  # a_x, a_y.

type: cbf_qp
slack_weight: 0.0  # 0: hard CBF-QP; >0: obstacle slack penalty (unicycle only).
qp_obs_top_k: null  # null: all; positive integer: nearest obstacles by robot-center distance.

solver:
  eps_abs: 1.0e-9
  eps_rel: 1.0e-9
  max_iter: 10000
  feasibility_tolerance: 1.0e-6
  polishing: false
  verbose: false

unicycle:
  lookahead: 0.2  # Shared tracking point for nominal control, CBF and QP.
  nominal:
    position_gain: 1.0
  cbf:
    alpha: 2.0
  qp:
    weights: [1.0, 1.0]  # World velocity x/y of the lookahead point.

quadrotor:
  nominal:
    position_gain: 1.0
    velocity_gain: 1.8
    attitude_gain: 4.0
    thrust_tracking_gain: 4.0
    acceleration_limits: [2.0, 2.0, 2.0]  # Desired acceleration clipping only.
  cbf:
    # Barrier rates [1/s]; permitted state ranges are defined in config/robot/quadrotor.yaml.
    gains: [1.5, 1.5, 1.5]  # Recursive k1/k2/k3 for obstacle and altitude HOCBFs.
    thrust_gain: 4.0  # k_T in nu >= -k_T*(T-T_min), nu <= k_T*(T_max-T).
    tilt_gain: 4.0  # k_tilt in d(R33)/dt + k_tilt*(R33-cos(tilt_max)) >= 0.
  qp:
    weights: [1.0, 1.0, 1.0, 1.0e-6]  # World jerk x/y/z, then yaw-rate tie-breaker.

humanoid:
  barrier: distance  # distance (second order) or parabolic (first order).
  nominal:
    position_gain: 1.0
    velocity_gain: 2.0
    heading_gain: 2.0
  cbf:
    distance:
      gains: [1.5, 1.5]
    parabolic:
      alpha: 2.0
      parabolic_gain: 1.0
      clearance_gain: 1.0
      speed_epsilon: 0.05  # Smooth speed regularization used in content.tex.
  qp:
    weights: [1.0, 1.0, 1.0]  # Forward/lateral acceleration, then yaw rate.

double_integrator:
  nominal:
    position_gain: 1.0
    velocity_gain: 2.0
  cbf:
    gains: [1.5, 1.5]  # Second-order distance CBF rates [1/s].
    speed_facets: 16  # Inscribed next-velocity polygon; conservatively enforces Euclidean v_max.
  qp:
    weights: [1.0, 1.0]  # World acceleration x/y.

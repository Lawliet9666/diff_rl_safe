type: single_integrator

radius: 0.3  # m

# Input limits.
# u = [v_x, v_y], world frame; Euclidean speed bound.
v_max: 1.2  # m/s; Euclidean norm

# Navigation.
goal_tolerance: 0.3  # m
goal_min_distance: 6.0  # m

# Reward scales.
reward:
  progress_speed_scale: ${robot.v_max}  # m/s; progress clipping
  potential_factor: 2.0
  back_factor: 0.0
  spin_factor: 0.0

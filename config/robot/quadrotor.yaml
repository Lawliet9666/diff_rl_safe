type: quadrotor

# Dynamics parameters.
mass: 1.0  # kg; robot mass
gravity: 9.81  # m/s^2; gravitational acceleration

# Collision geometry.
radius: 0.3  # m; collision-envelope radius

# Control input limits.
# u = [omega_x, omega_y, omega_z, nu]; omega is body-frame rate, nu = dT/dt.
# Enforced by hard QP bounds; the integrator does not clip inputs.
omega_max: 2.0  # rad/s; |omega_j| <= omega_max for j = x, y, z
thrust_rate_max: 20.0  # N/s; |nu| <= thrust_rate_max

# State limits.
# Enforced by CBF constraints; the integrator does not clip these states.
thrust_min: 2.0  # N; T >= thrust_min
thrust_max: 20.0  # N; T <= thrust_max
tilt_max: 0.7853981633974483  # rad (45 deg); tilt of R's thrust axis <= tilt_max
altitude_min: 0.8  # m; world-frame z >= altitude_min
altitude_max: 1.6  # m; world-frame z <= altitude_max

# Reference values (not state limits).
altitude: 1.2  # m; hover/goal altitude reference

# Numerical integration.
# The environment/control period is env.dt.
max_integration_dt: 0.005  # s; maximum robot integration substep

# Navigation settings.
goal_tolerance: 0.6  # m; goal arrival distance
goal_min_distance: 6.0  # m; minimum sampled start-to-goal distance

# Reward settings (not dynamics or control input limits).
# Controller-only evaluation for this model returns reward=None.
reward:
  progress_speed_scale: 1.5  # m/s; progress-reward clipping scale
  potential_factor: 3.0  # Goal-progress reward weight.
  back_factor: 0.1  # Backward-motion penalty weight.
  spin_factor: 4.5  # Turning penalty weight.

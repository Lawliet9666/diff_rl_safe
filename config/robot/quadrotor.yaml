type: quadrotor

# Dynamics.
mass: 1.0  # kg
gravity: 9.81  # m/s^2

radius: 0.3  # m

# Input limits.
# u = [omega_x, omega_y, omega_z, dT/dt]; body-frame rates.
omega_max: 1.57  # rad/s; per body axis
thrust_rate_max: 20.0  # N/s

# State limits.
# Enforced by state CBFs.
v_max: 1.2  # m/s; full 3D speed magnitude
thrust_min: 2.0  # N
thrust_max: 20.0  # N
tilt_max: 0.7853981633974483  # rad (45 deg)
altitude_min: 0.8  # m
altitude_max: 1.6  # m

# Reference.
altitude: 1.2  # m; hover altitude

max_integration_dt: 0.005  # s; robot substep bound

# Navigation.
goal_tolerance: 0.3  # m
goal_min_distance: 6.0  # m

# Reward scales.
reward:
  cbf_rl:
    weight: 0.01  # Shared coefficient for raw violation + correction.
    sigma: [1.0, 1.0, 1.0, 10.0]  # Body rates [rad/s], thrust rate [N/s].
  progress_speed_scale: ${robot.v_max}  # m/s; progress clipping
  potential_factor: 3.0
  back_factor: 0.1
  spin_factor: 4.5

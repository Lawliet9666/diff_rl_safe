type: humanoid

radius: 0.3  # m

# Input limits.
# u = [a_f, a_l, omega], body frame.
af_max: 4.0  # m/s^2
al_max: 2.0  # m/s^2
omega_max: 1.57  # rad/s

# State limits.
# Total planar speed; enforced by a continuous-time CBF (check sampled execution).
v_max: 1.2  # m/s; magnitude

max_integration_dt: 0.01  # s; robot substep bound

# Navigation.
goal_tolerance: 0.3  # m
goal_min_distance: 6.0  # m

# Reward scales.
reward:
  progress_speed_scale: ${robot.v_max}  # m/s; progress clipping
  potential_factor: 3.0
  back_factor: 0.1
  spin_factor: 4.5

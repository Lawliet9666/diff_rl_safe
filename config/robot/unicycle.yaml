type: unicycle

radius: 0.3  # m

# Input limits.
# u = [v, omega], body forward speed and yaw rate.
v_max: 1.2  # m/s
omega_max: 1.57  # rad/s

# Navigation.
goal_tolerance: 0.3  # m
goal_min_distance: 6.0  # m

# Reward scales.
reward:
  cbf_rl:
    weight: 0.01  # Shared coefficient for raw violation + correction.
    sigma: [1.5, 2.0]  # v [m/s], omega [rad/s]; manual starting values.
  progress_speed_scale: ${robot.v_max}  # m/s; progress clipping
  potential_factor: 3.0
  back_factor: 0.1
  spin_factor: 4.5

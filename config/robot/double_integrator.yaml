type: double_integrator

radius: 0.3  # m

# Input limits.
# u = [a_x, a_y], world frame; componentwise bounds.
a_max: 2.0  # m/s^2

# State limits.
# No velocity limits.

# Navigation.
goal_tolerance: 0.6  # m
goal_min_distance: 6.0  # m

# Reward scales.
reward:
  progress_speed_scale: 1.5  # m/s; progress clipping
  potential_factor: 3.0
  back_factor: 0.1
  spin_factor: 4.5

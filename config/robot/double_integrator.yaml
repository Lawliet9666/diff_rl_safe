type: double_integrator

radius: 0.3  # m

# Input limits.
# u = [a_x, a_y], world frame; componentwise bounds.
a_max: 2.0  # m/s^2

# State limits.
# Total planar speed; enforced by a continuous-time CBF (check sampled execution).
v_max: 1.2  # m/s

# Navigation.
goal_tolerance: 0.3  # m
goal_min_distance: 6.0  # m

# Reward scales.
reward:
  cbf_rl:
    weight: 0.01  # Shared coefficient for raw violation + correction.
    sigma: [1.0, 1.0]  # ax, ay [m/s^2]; manual starting values.
  progress_speed_scale: ${robot.v_max}  # m/s; progress clipping
  potential_factor: 3.0
  back_factor: 0.0
  spin_factor: 0.0

total_timesteps: 20000000
num_envs: ${oc.select:env.num_envs,128}

# Bootstrap timeout values from the final observation.
timeout_bootstrap: true

gamma: 0.99
lam: 0.98
normalize_advantages: true
lr: 0.0001
target_kl: 0.02
use_target_kl_early_stop: true
learning_rate_schedule: linear
desired_kl: 0.01
learning_rate_schedule_min_lr: 1.0e-6
learning_rate_schedule_max_lr: 0.0
adaptive_kl_factor: 1.5
clip: 0.2
ent_coef: 0.01
vf_coef: 0.5
value_clip: 0.0
max_grad_norm: 0.5
finite_check_interval: 10

timesteps_per_batch: 4096
n_updates_per_iteration: 4
num_minibatches: 32
use_init_weights: true

eval_interval: 100
eval_freq_timesteps: 0
eval_episodes: 20
max_checkpoints: 10

# External fixed-CBF filter for ordinary PPO; also enabled during evaluation.
safety_filter:
  enabled: false
  qp_obs_top_k: 5  # null: all; positive integer: nearest active obstacles.
  slack_weight: 10.0  # Obstacle rows only; 0 selects hard constraints.
  speed_facets: 16  # Single-integrator speed disk inner approximation only.
  max_iter: 40
  eps: 1.0e-12
